<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/layout-fix.css?v=20260910-6" />
    <link rel="stylesheet" href="/typography.css" />
    <link rel="stylesheet" href="/detail-scroll.css" />
    <link rel="stylesheet" href="/detail-hero-fix.css?v=20260910-6" />
    <link rel="stylesheet" href="/performance.css" />
    <title>alcproductshowcase-2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('click', (event) => {
        const bottle = event.target.closest('.bottle')
        if (!bottle) return
        const explore = document.querySelector('.explore')
        if (explore) explore.click()
      })

      const syncDetailBottle = () => {
        const showcase = document.querySelector('.showcase')
        const bottles = [...document.querySelectorAll('.showcase .bottle')]
        if (!showcase || !bottles.length) return
        const isDetail = showcase.classList.contains('is-detail')
        bottles.forEach((bottle) => bottle.removeAttribute('data-bottle-active'))
        if (!isDetail) return
        let hero = null
        let largest = -Infinity
        bottles.forEach((bottle) => {
          const scale = parseFloat(getComputedStyle(bottle).getPropertyValue('--base-scale')) || 0
          if (scale > largest) { largest = scale; hero = bottle }
        })
        hero?.setAttribute('data-bottle-active', 'true')
      }

      document.addEventListener('click', (event) => {
        const showcase = document.querySelector('.showcase.is-detail')
        if (!showcase) return
        if (event.target.closest('.detail-back')) {
          showcase.classList.add('detail-closing')
          return
        }
        if (event.target.closest('.detail-scroll-content')) return
        if (event.target.closest('.bottle')) return
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }))
      }, true)

      document.addEventListener('click', (event) => {
        const back = event.target.closest('.detail-back')
        if (!back) return
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }))
      })

      new MutationObserver(syncDetailBottle).observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class']
      })
      requestAnimationFrame(syncDetailBottle)
    </script>
    <script src="/detail-scroll.js"></script>
    <script src="/performance.js"></script>
  </body>
</html>
