<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/layout-fix.css" />
    <link rel="stylesheet" href="/typography.css" />
    <link rel="stylesheet" href="/detail-scroll.css" />
    <title>alcproductshowcase-2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clicking any visible bottle uses the same action as the Explore button.
      document.addEventListener('click', (event) => {
        const bottle = event.target.closest('.bottle')
        if (!bottle) return
        const explore = document.querySelector('.explore')
        if (explore) explore.click()
      })
    </script>
    <script src="/detail-scroll.js"></script>
  </body>
</html>
